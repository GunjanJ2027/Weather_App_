<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atmosphere — Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <main class="app">

    <!-- Header -->
    <header class="app__header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/><circle cx="12" cy="12" r="5"/></svg>
        <span>Atmosphere</span>
      </div>

      <form class="search-form" id="searchForm" role="search">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search city…"
          autocomplete="off"
          aria-label="Search for a city"
        />
        <button type="submit" class="search-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </form>
    </header>

    <!-- States -->
    <div class="state state--loading" id="stateLoading" aria-live="polite">
      <div class="spinner"></div>
      <p class="state__text" id="loadingText">Detecting your location…</p>
    </div>

    <div class="state state--error" id="stateError" aria-live="assertive" hidden>
      <div class="state__icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      </div>
      <p class="state__text" id="errorText">Something went wrong.</p>
      <p class="state__subtext">Try searching for a city above.</p>
    </div>

    <!-- Weather Card -->
    <section class="weather-card" id="weatherCard" hidden aria-label="Current weather">

      <!-- Ambient background icon -->
      <div class="ambient-icon" aria-hidden="true">
        <img id="ambientIcon" src="" alt="" />
      </div>

      <!-- Primary: Location + Temp -->
      <div class="weather-primary">
        <div class="location">
          <svg class="location__pin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="cityName">—</span>
          <span class="location__country" id="countryCode"></span>
        </div>

        <div class="temperature-wrap">
          <span class="temperature" id="temperature">—</span>
          <div class="unit-toggle" id="unitToggle" role="group" aria-label="Temperature unit">
            <button class="unit-btn unit-btn--active" data-unit="metric" aria-pressed="true">°C</button>
            <span class="unit-sep">/</span>
            <button class="unit-btn" data-unit="imperial" aria-pressed="false">°F</button>
          </div>
        </div>

        <div class="condition">
          <img id="conditionIcon" src="" alt="" class="condition__icon" />
          <span id="conditionText">—</span>
        </div>
      </div>

      <!-- Divider -->
      <div class="weather-divider" aria-hidden="true"></div>

      <!-- Secondary: Details -->
      <div class="weather-details">
        <div class="detail-item">
          <svg class="detail-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
          <div>
            <span class="detail-item__label">Feels Like</span>
            <span class="detail-item__value" id="feelsLike">—</span>
          </div>
        </div>

        <div class="detail-item">
          <svg class="detail-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          <div>
            <span class="detail-item__label">Humidity</span>
            <span class="detail-item__value" id="humidity">—</span>
          </div>
        </div>

        <div class="detail-item">
          <svg class="detail-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
          <div>
            <span class="detail-item__label">Wind Speed</span>
            <span class="detail-item__value" id="windSpeed">—</span>
          </div>
        </div>

        <div class="detail-item">
          <svg class="detail-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <div>
            <span class="detail-item__label">Pressure</span>
            <span class="detail-item__value" id="pressure">—</span>
          </div>
        </div>

        <div class="detail-item">
          <svg class="detail-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v1M12 20v1M4.22 4.22l.7.7M19.07 19.07l.71.71M1 12h1M22 12h1M4.22 19.78l.7-.7M19.07 4.93l.71-.71"/><path d="M17 12a5 5 0 1 1-10 0"/></svg>
          <div>
            <span class="detail-item__label">UV / Visibility</span>
            <span class="detail-item__value" id="visibility">—</span>
          </div>
        </div>

        <div class="detail-item">
          <svg class="detail-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <div>
            <span class="detail-item__label">Local Time</span>
            <span class="detail-item__value" id="localTime">—</span>
          </div>
        </div>

      </div>

      <!-- Last updated -->
      <p class="last-updated">
        Updated <span id="lastUpdated">—</span>
        <button class="refresh-btn" id="refreshBtn" aria-label="Refresh weather data">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          Refresh
        </button>
      </p>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
